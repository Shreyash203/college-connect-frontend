name: Build mobile applications

on:
  push:
    branches: [mobile-deploy]
  pull_request:
    branches: [mobile-deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run mobile:check
      - run: npm run build:mobile
      - run: npx cap sync android
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK and unsigned release bundle
        working-directory: android
        run: bash gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run mobile:check
      - run: npm run build:mobile
      - run: npx cap sync ios
      - name: Build iOS Simulator app without signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Package Simulator app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Debug-iphonesimulator/App.app artifacts/CollegeConnect-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: artifacts/CollegeConnect-iOS-Simulator.zip
          if-no-files-found: error
