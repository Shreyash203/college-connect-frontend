<div class="mx-auto flex max-w-md flex-col gap-6 rounded-3xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-8 shadow-sm">
      <div class="space-y-2">
        <p class="text-sm font-semibold uppercase tracking-[0.3em] text-blue-600">Reset Password</p>
        <h2 class="text-3xl font-semibold text-slate-900 dark:text-slate-100">Set a new password</h2>
      </div>
      <form (ngSubmit)="resetPassword()" class="flex flex-col gap-4">
        <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Email</label>
        <input type="email" [(ngModel)]="email" name="email" required class="w-full rounded-2xl border border-slate-300 dark:border-slate-600 px-4 py-3 outline-none transition focus:border-blue-500" />
        <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Reset Code</label>
        <input type="text" [(ngModel)]="otp" name="otp" required maxlength="6" class="w-full rounded-2xl border border-slate-300 dark:border-slate-600 px-4 py-3 outline-none transition focus:border-blue-500" />
        <label class="text-sm font-medium text-slate-700 dark:text-slate-300">New Password</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" required minlength="8" class="w-full rounded-2xl border border-slate-300 dark:border-slate-600 px-4 py-3 outline-none transition focus:border-blue-500" />
        <button type="submit" class="mt-2 rounded-2xl bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700">Reset Password</button>
      </form>
      <div *ngIf="message" [ngClass]="messageType === 'error' ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700 dark:text-emerald-400'" class="rounded-2xl px-4 py-3 text-sm">{{ message }}</div>
      <a routerLink="/login" class="text-sm text-blue-600 hover:underline">Back to Login</a>
    </div>
