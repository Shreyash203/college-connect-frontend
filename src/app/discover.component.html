<section class="mx-auto max-w-4xl rounded-3xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-8 shadow-sm">
      <h2 class="text-2xl font-semibold mb-6 text-slate-800 dark:text-slate-200">Discover Connections</h2>
            <!-- Skeleton Loader -->
      <div *ngIf="isLoading && profiles.length === 0" class="grid gap-6 sm:grid-cols-2 md:grid-cols-3">
        <div *ngFor="let _ of [1,2,3]" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 text-center shadow-sm animate-pulse">
          <div class="mx-auto w-24 h-24 rounded-full bg-slate-200 dark:bg-slate-800 mb-4"></div>
          <div class="h-5 bg-slate-200 dark:bg-slate-800 rounded w-3/4 mx-auto mb-2"></div>
          <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded w-1/2 mx-auto mb-4"></div>
          <div class="flex justify-center gap-2 mt-3">
            <div class="h-6 bg-slate-200 dark:bg-slate-800 rounded w-12"></div>
            <div class="h-6 bg-slate-200 dark:bg-slate-800 rounded w-16"></div>
          </div>
        </div>
      </div>

      <!-- Real Data -->
      <div *ngIf="!isLoading || profiles.length > 0">
        <div *ngIf="profiles.length; else noProfiles">
        <div class="grid gap-6 sm:grid-cols-2 md:grid-cols-3">
            <div *ngFor="let p of profiles" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 text-center hover:shadow-lg transition-shadow">
              <div class="mb-4">
                <img *ngIf="p.image_url" [src]="p.image_url" class="mx-auto w-24 h-24 rounded-full object-cover border-4 border-slate-100 dark:border-slate-800" />
                <div *ngIf="!p.image_url" class="mx-auto w-24 h-24 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center font-bold text-slate-500 text-sm">USER</div>
              </div>
              <h3 class="text-xl font-bold text-slate-900 dark:text-slate-100 mb-1">{{ p.display_name || 'Unnamed' }}</h3>
              <p class="text-sm font-medium text-blue-600 dark:text-blue-400 mb-2">{{ p.department || 'N/A' }} &bull; {{ p.year || 'N/A' }}</p>
              <div class="mt-3 flex flex-wrap justify-center gap-2">
                 <span *ngFor="let interest of p.interests" class="text-xs bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 px-2 py-1 rounded-md">
                   {{ interest }}
                 </span>
              </div>
            </div>
        </div>
        <div *ngIf="profiles.length > 0 && profiles.length % limit === 0" class="flex justify-center mt-8">
          <button (click)="loadMore()" class="px-6 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors font-medium">Load More Connections</button>
        </div>
      </div>
      <ng-template #noProfiles>
        <p class="text-slate-500 dark:text-slate-400 text-center py-12">No profiles found.</p>
      </ng-template>
      </div>
    </section>
