<div class="mx-auto flex max-w-md flex-col gap-6 rounded-3xl border border-slate-200/60 dark:border-slate-700/60 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl p-8 shadow-2xl mt-4">
      <div class="space-y-2">
        <p class="text-sm font-semibold uppercase tracking-[0.3em] text-blue-600">Join us</p>
        <h2 class="text-3xl font-semibold text-slate-900 dark:text-slate-100">Create your account</h2>
      </div>
      <ng-container *ngIf="step === 'register'">
        <form (ngSubmit)="register()" class="flex flex-col gap-4">
          <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Email</label>
          <input type="email" [(ngModel)]="email" name="email" required [disabled]="isRegistering" class="w-full rounded-2xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-4 py-3 outline-none transition focus:border-blue-500 disabled:cursor-not-allowed disabled:bg-slate-100 dark:disabled:bg-slate-700" />
          <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
          <div class="relative w-full">
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required minlength="8" [disabled]="isRegistering" class="w-full rounded-2xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-4 py-3 pr-12 outline-none transition focus:border-blue-500 disabled:cursor-not-allowed disabled:bg-slate-100 dark:disabled:bg-slate-700" />
            <button type="button" (click)="showPassword = !showPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-sm font-medium transition-colors">
              {{ showPassword ? 'Hide 👁️' : 'Show 👁️' }}
            </button>
          </div>
          <button type="submit" [disabled]="isRegistering" class="mt-2 rounded-2xl bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-blue-400">
            {{ isRegistering ? 'Sending OTP...' : 'Register' }}
          </button>
        </form>

        <div class="relative flex items-center justify-center my-1">
          <div class="grow border-t border-slate-200 dark:border-slate-700"></div>
          <span class="shrink mx-4 text-xs font-bold text-slate-400 uppercase tracking-widest">or</span>
          <div class="grow border-t border-slate-200 dark:border-slate-700"></div>
        </div>

        <div class="flex justify-center w-full min-h-[44px]">
          <div id="googleRegisterBtn"></div>
        </div>
      </ng-container>
      <ng-container *ngIf="step === 'otp'">
        <form (ngSubmit)="verifyOtp()" class="flex flex-col gap-4">
          <p class="text-sm text-slate-600 dark:text-slate-400">We've sent a verification code to <strong>{{ email }}</strong>. Enter it below to complete your registration.</p>
          <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Verification Code</label>
          <input type="text" [(ngModel)]="otp" name="otp" required maxlength="6" class="w-full rounded-2xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-4 py-3 outline-none transition focus:border-blue-500" />
          <button type="submit" class="mt-2 rounded-2xl bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700">Verify</button>
          <button type="button" (click)="resendOtp()" class="text-sm text-blue-600 hover:underline">Resend code</button>
        </form>
      </ng-container>
      <div *ngIf="message" [ngClass]="messageType === 'error' ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700 dark:text-emerald-400'" class="rounded-2xl px-4 py-3 text-sm">{{ message }}</div>
</div>
