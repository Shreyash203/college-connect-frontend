<div class="relative mx-auto flex max-w-md flex-col gap-6 rounded-3xl border border-slate-200/60 dark:border-slate-700/60 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl p-8 shadow-2xl mt-4 overflow-hidden">
      <!-- Loading Overlay -->
      <div *ngIf="isProcessing" class="absolute inset-0 z-50 flex items-center justify-center bg-white/70 dark:bg-slate-900/70 backdrop-blur-sm">
        <div class="flex flex-col items-center gap-3">
          <div class="h-10 w-10 animate-spin rounded-full border-4 border-blue-600 border-t-transparent"></div>
          <p class="font-medium text-slate-700 dark:text-slate-200">Please wait...</p>
        </div>
      </div>
      
      <div class="space-y-2">
        <p class="text-sm font-semibold uppercase tracking-[0.3em] text-blue-600">Join us</p>
        <h2 class="text-3xl font-semibold text-slate-900 dark:text-slate-100">Create your account</h2>
      </div>
      <ng-container *ngIf="step === 'register'">
        <form (ngSubmit)="register()" class="flex flex-col gap-4">
          <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Email</label>
          <input type="email" [(ngModel)]="email" name="email" required [disabled]="isProcessing" class="w-full rounded-2xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-4 py-3 outline-none transition focus:border-blue-500 disabled:cursor-not-allowed disabled:bg-slate-100 dark:disabled:bg-slate-700" />
          <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
          <div class="relative w-full">
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required minlength="8" [disabled]="isProcessing" class="w-full rounded-2xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-4 py-3 pr-12 outline-none transition focus:border-blue-500 disabled:cursor-not-allowed disabled:bg-slate-100 dark:disabled:bg-slate-700" />
            <button type="button" (click)="showPassword = !showPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors p-1" title="Toggle password visibility">
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
          <button type="submit" [disabled]="isProcessing" class="mt-2 rounded-2xl bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-blue-400 flex justify-center items-center gap-2">
            <span *ngIf="isProcessing" class="inline-block h-5 w-5 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
            {{ isProcessing ? 'Processing...' : 'Register' }}
          </button>
        </form>

        <div class="relative flex items-center justify-center my-1">
          <div class="grow border-t border-slate-200 dark:border-slate-700"></div>
          <span class="shrink mx-4 text-xs font-bold text-slate-400 uppercase tracking-widest">or</span>
          <div class="grow border-t border-slate-200 dark:border-slate-700"></div>
        </div>

        <div class="flex justify-center w-full min-h-[44px]">
          <div id="googleRegisterBtn"></div>
        </div>
      </ng-container>
      <ng-container *ngIf="step === 'otp'">
        <form (ngSubmit)="verifyOtp()" class="flex flex-col gap-4">
          <p class="text-sm text-slate-600 dark:text-slate-400">We've sent a verification code to <strong>{{ email }}</strong>. Enter it below to complete your registration.</p>
          <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Verification Code</label>
          <input type="text" [(ngModel)]="otp" name="otp" required maxlength="6" [disabled]="isProcessing" class="w-full rounded-2xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-4 py-3 outline-none transition focus:border-blue-500 disabled:cursor-not-allowed disabled:bg-slate-100 dark:disabled:bg-slate-700" />
          <button type="submit" [disabled]="isProcessing" class="mt-2 rounded-2xl bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-blue-400 flex justify-center items-center gap-2">
            <span *ngIf="isProcessing" class="inline-block h-5 w-5 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
            {{ isProcessing ? 'Verifying...' : 'Verify' }}
          </button>
          <button type="button" (click)="resendOtp()" class="text-sm text-blue-600 hover:underline">Resend code</button>
        </form>
      </ng-container>
      <div *ngIf="message" [ngClass]="messageType === 'error' ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700 dark:text-emerald-400'" class="rounded-2xl px-4 py-3 text-sm">{{ message }}</div>
</div>
