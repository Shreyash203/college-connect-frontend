<div class="mx-auto max-w-xl py-8">
      <div class="mb-10 text-center sm:text-left">
        <h2 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Settings</h2>
        <p class="text-sm text-slate-500 mt-1">Manage your public profile and account details.</p>
      </div>
      <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 mb-10">
        <div class="relative group">
          <img *ngIf="imageUrl" [src]="imageUrl" class="w-32 h-32 rounded-full object-cover border-4 border-white dark:border-slate-800 shadow-sm" />
          <div *ngIf="!imageUrl" class="w-32 h-32 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center border-4 border-white dark:border-slate-800 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
          </div>
        </div>
        <div class="flex-grow text-center sm:text-left">
          <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3">Profile Photo</label>
          
          <!-- Custom File Upload Button -->
          <label class="inline-block cursor-pointer rounded-full bg-blue-50 dark:bg-blue-900/30 px-5 py-2.5 text-sm font-semibold text-blue-600 dark:text-blue-400 transition-colors hover:bg-blue-100 dark:hover:bg-blue-900/50 shadow-sm border border-blue-100 dark:border-blue-800">
            <span>Change photo</span>
            <input type="file" (change)="onFileSelected($event)" class="hidden" accept="image/*" />
          </label>
          <p class="text-xs text-slate-400 mt-3">Recommended: Square image, max 2MB.</p>
        </div>
      </div>

      <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="flex flex-col gap-5">
        <div>
          <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 block mb-1.5">Display Name</label>
          <input type="text" formControlName="display_name" class="w-full rounded-lg border border-slate-200 dark:border-slate-700/80 bg-white dark:bg-slate-900/50 text-slate-900 dark:text-slate-100 px-4 py-2.5 outline-none transition focus:border-blue-500 focus:ring-1 focus:ring-blue-500 shadow-sm" />
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div>
            <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 block mb-1.5">Department</label>
            <input type="text" formControlName="department" placeholder="e.g. Computer Science" class="w-full rounded-lg border border-slate-200 dark:border-slate-700/80 bg-white dark:bg-slate-900/50 text-slate-900 dark:text-slate-100 px-4 py-2.5 outline-none transition focus:border-blue-500 focus:ring-1 focus:ring-blue-500 shadow-sm" />
          </div>
          <div>
            <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 block mb-1.5">Year of Study</label>
            <input type="text" formControlName="year" placeholder="e.g. Senior" class="w-full rounded-lg border border-slate-200 dark:border-slate-700/80 bg-white dark:bg-slate-900/50 text-slate-900 dark:text-slate-100 px-4 py-2.5 outline-none transition focus:border-blue-500 focus:ring-1 focus:ring-blue-500 shadow-sm" />
          </div>
        </div>
        
        <div>
          <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 block mb-1.5">Bio</label>
          <textarea formControlName="bio" rows="3" placeholder="Tell us a little about yourself..." class="w-full rounded-lg border border-slate-200 dark:border-slate-700/80 bg-white dark:bg-slate-900/50 text-slate-900 dark:text-slate-100 px-4 py-2.5 outline-none transition focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-y shadow-sm"></textarea>
        </div>
        
        <div>
          <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 block mb-1.5">Interests <span class="text-slate-400 font-normal">(comma separated)</span></label>
          <input type="text" formControlName="interests" placeholder="e.g. Coding, Basketball, Photography" class="w-full rounded-lg border border-slate-200 dark:border-slate-700/80 bg-white dark:bg-slate-900/50 text-slate-900 dark:text-slate-100 px-4 py-2.5 outline-none transition focus:border-blue-500 focus:ring-1 focus:ring-blue-500 shadow-sm" />
        </div>
        
                <div class="pt-4 flex items-center justify-between">
          <button type="submit" [disabled]="profileForm.invalid || isSaving" class="rounded-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-8 py-3 font-semibold transition hover:opacity-90 disabled:opacity-50 flex items-center shadow-sm">
            <svg *ngIf="isSaving" class="animate-spin -ml-1 mr-3 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            {{ isSaving ? 'Saving...' : 'Save Changes' }}
          </button>
        </div>
      </form>
      <div *ngIf="message" class="rounded-xl bg-slate-50 dark:bg-slate-800/50 px-4 py-3 mt-6 text-sm font-medium text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700/50">{{ message }}</div>
      
      <hr class="border-slate-100 dark:border-slate-800/60 my-10" />
      
      <div class="flex flex-col gap-3 pb-8">
        <h3 class="text-xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Account Settings</h3>
        <p class="text-sm text-slate-500 mb-2">Manage your session and account details.</p>
        <button type="button" (click)="logout()" class="w-full sm:w-auto rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-6 py-3 font-semibold text-red-600 transition hover:bg-red-50 dark:hover:bg-red-950/20 self-start shadow-sm hover:border-red-200 dark:hover:border-red-900/50">
          Log Out
        </button>
      </div>
    </div>
