<div class="mx-auto flex max-w-4xl flex-col gap-6 rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-8 shadow-sm">
      <div class="space-y-2 text-center">
        <p class="text-sm font-semibold uppercase tracking-[0.3em] text-blue-600 dark:text-blue-400">Profile</p>
        <h2 class="text-3xl font-semibold text-slate-900 dark:text-slate-100">Build Your Profile</h2>
        <!-- Profile picture preview -->
        <img *ngIf="imageUrl" [src]="imageUrl" class="mx-auto mb-4 w-32 h-32 rounded-full object-cover border dark:border-slate-700" />
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Profile Photo</label>
        <input type="file" (change)="onFileSelected($event)" class="block w-full text-sm text-slate-500 dark:text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:bg-blue-600 file:text-white hover:file:bg-blue-700 dark:file:bg-blue-700 dark:hover:file:bg-blue-600" />
      </div>
      <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="flex flex-col gap-4">
        <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Display Name</label>
        <input type="text" formControlName="display_name" class="w-full rounded-2xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-4 py-3 outline-none transition focus:border-blue-500 dark:focus:border-blue-500" />
        
        <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Department</label>
        <input type="text" formControlName="department" class="w-full rounded-2xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-4 py-3 outline-none transition focus:border-blue-500 dark:focus:border-blue-500" />
        
        <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Year</label>
        <input type="text" formControlName="year" class="w-full rounded-2xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-4 py-3 outline-none transition focus:border-blue-500 dark:focus:border-blue-500" />
        
        <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Bio</label>
        <textarea formControlName="bio" rows="4" class="w-full rounded-2xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-4 py-3 outline-none transition focus:border-blue-500 dark:focus:border-blue-500"></textarea>
        
        <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Interests (comma separated)</label>
        <input type="text" formControlName="interests" class="w-full rounded-2xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 px-4 py-3 outline-none transition focus:border-blue-500 dark:focus:border-blue-500" />
        
                <button type="submit" [disabled]="profileForm.invalid || isSaving" class="mt-2 rounded-2xl bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:opacity-50 flex justify-center items-center">
          <svg *ngIf="isSaving" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ isSaving ? 'Saving...' : 'Save Profile' }}
        </button>
      </form>
      <div *ngIf="message" class="rounded-2xl bg-blue-50 dark:bg-blue-900/30 px-4 py-3 text-sm text-blue-700 dark:text-blue-400 border border-blue-200 dark:border-blue-800">{{ message }}</div>
    </div>
