<div class="mx-auto flex max-w-md flex-col gap-6 rounded-3xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-8 shadow-sm">
      <div class="space-y-2">
        <p class="text-sm font-semibold uppercase tracking-[0.3em] text-blue-600">Trouble logging in?</p>
        <h2 class="text-3xl font-semibold text-slate-900 dark:text-slate-100">Forgot Password</h2>
      </div>
      <ng-container *ngIf="step === 'request'">
        <form (ngSubmit)="sendResetCode()" class="flex flex-col gap-4">
          <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Email</label>
          <input type="email" [(ngModel)]="email" name="email" required class="w-full rounded-2xl border border-slate-300 dark:border-slate-600 px-4 py-3 outline-none transition focus:border-blue-500" />
          <button type="submit" [disabled]="isSendingCode" class="mt-2 rounded-2xl bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-blue-400">{{ isSendingCode ? 'Sending...' : 'Send Reset Code' }}</button>
        </form>
      </ng-container>
      <ng-container *ngIf="step === 'reset'">
        <form (ngSubmit)="resetPassword()" class="flex flex-col gap-4">
          <p class="text-sm text-slate-600 dark:text-slate-400">Enter the code sent to <strong>{{ email }}</strong> and your new password.</p>
          <button type="button" (click)="resendResetCode()" [disabled]="isSendingCode || resendCooldownSeconds > 0" class="self-start text-sm text-blue-600 hover:underline disabled:cursor-not-allowed disabled:text-slate-400 disabled:no-underline">
            {{ isSendingCode ? 'Sending...' : (resendCooldownSeconds > 0 ? 'Resend code in ' + resendCooldownSeconds + 's' : 'Resend code') }}
          </button>
          <div class="rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/50 p-3 text-xs text-amber-800 dark:text-amber-300 flex items-start gap-2">
            <span>📩</span>
            <span><strong>Tip:</strong> If you don't see the email, please check your <strong>Spam / Junk</strong> folder.</span>
          </div>
          <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Reset Code</label>
          <input type="text" [(ngModel)]="otp" name="otp" required maxlength="6" class="w-full rounded-2xl border border-slate-300 dark:border-slate-600 px-4 py-3 outline-none transition focus:border-blue-500" />
          <label class="text-sm font-medium text-slate-700 dark:text-slate-300">New Password</label>
          <input type="password" [(ngModel)]="newPassword" name="newPassword" required minlength="8" class="w-full rounded-2xl border border-slate-300 dark:border-slate-600 px-4 py-3 outline-none transition focus:border-blue-500" />
          <button type="submit" [disabled]="isResettingPassword" class="mt-2 rounded-2xl bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-blue-400">
            {{ isResettingPassword ? 'Resetting...' : 'Reset Password' }}
          </button>
        </form>
      </ng-container>
      <div *ngIf="message" [ngClass]="messageType === 'error' ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700 dark:text-emerald-400'" class="rounded-2xl px-4 py-3 text-sm">{{ message }}</div>
      <a routerLink="/login" class="text-sm text-blue-600 hover:underline">Back to Login</a>
    </div>
