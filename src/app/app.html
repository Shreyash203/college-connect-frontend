<main class="app-shell flex flex-col min-h-screen relative overflow-x-hidden" [class.dark]="darkMode">
  <!-- Minimalist, full-width glassmorphism header -->
  <header class="sticky top-0 z-50 flex flex-col sm:flex-row sm:items-center sm:justify-between px-6 sm:px-12 border-b shadow-sm backdrop-blur-xl transition-colors duration-300" [ngClass]="darkMode ? 'border-slate-800/60 bg-black/70 text-white' : 'border-slate-200/60 bg-white/70 text-slate-900'">
    <div class="py-4 flex items-center gap-3">
      <!-- Minimalist Startup Icon (Interlocking C's) -->
      <div class="w-10 h-10 shrink-0 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-full h-full">
          <path d="M 40 20 A 30 30 0 1 0 40 80" fill="none" class="stroke-slate-900 dark:stroke-white transition-colors" stroke-width="14" stroke-linecap="round" />
          <path d="M 60 20 A 30 30 0 1 1 60 80" fill="none" class="stroke-blue-700 dark:stroke-blue-500 transition-colors" stroke-width="14" stroke-linecap="round" />
        </svg>
      </div>
      <div class="flex flex-col justify-center">
        <h1 class="text-xl font-extrabold tracking-tight leading-none text-slate-900 dark:text-white">College<span class="text-blue-700 dark:text-blue-500">Connect</span></h1>
        <p class="text-[10px] font-semibold uppercase tracking-[0.25em] text-slate-500 dark:text-slate-400 mt-1">Connect. Exchange. Share.</p>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-4 sm:gap-6 text-sm font-semibold h-full pt-2 sm:pt-0">
      <ng-container *ngIf="!(isLoggedIn$ | async); else loggedInNav">
        <a routerLink="/" routerLinkActive="!border-slate-900 dark:!border-white text-slate-900 dark:text-white" [routerLinkActiveOptions]="{exact: true}" class="py-4 border-b-2 border-transparent transition-all hover:text-slate-900 dark:hover:text-white text-slate-500 dark:text-slate-400">Home</a>
        <a routerLink="/login" routerLinkActive="!border-slate-900 dark:!border-white text-slate-900 dark:text-white" class="py-4 border-b-2 border-transparent transition-all hover:text-slate-900 dark:hover:text-white text-slate-500 dark:text-slate-400 font-bold">Sign In / Register</a>
      </ng-container>
      <ng-template #loggedInNav>
        <a routerLink="/feed" routerLinkActive="!border-slate-900 dark:!border-white text-slate-900 dark:text-white" class="py-4 border-b-2 border-transparent transition-all hover:text-slate-900 dark:hover:text-white text-slate-500 dark:text-slate-400 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" /></svg>
          Feed
        </a>
        <a routerLink="/discover" routerLinkActive="!border-slate-900 dark:!border-white text-slate-900 dark:text-white" class="py-4 border-b-2 border-transparent transition-all hover:text-slate-900 dark:hover:text-white text-slate-500 dark:text-slate-400 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          Discover
        </a>
        <a routerLink="/marketplace" routerLinkActive="!border-slate-900 dark:!border-white text-slate-900 dark:text-white" class="py-4 border-b-2 border-transparent transition-all hover:text-slate-900 dark:hover:text-white text-slate-500 dark:text-slate-400 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
          Bazaar
        </a>
      </ng-template>
      
      <!-- Right side icons -->
      <div class="flex items-center gap-2 sm:gap-4 ml-auto sm:ml-4 mb-4 sm:mb-0 self-center">
        <a *ngIf="(isLoggedIn$ | async)" routerLink="/notifications" routerLinkActive="bg-slate-100 dark:bg-slate-800" class="rounded-full border border-slate-200 dark:border-slate-800 p-2 transition-all hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 relative" title="Notifications">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
        </a>
        <a *ngIf="(isLoggedIn$ | async)" routerLink="/profile" class="rounded-full border border-slate-200 dark:border-slate-800 p-2 transition-all hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400" title="Settings">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </a>
        <button type="button" (click)="toggleTheme()" class="rounded-full border border-slate-200 dark:border-slate-800 p-2 transition-all hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400" title="Toggle Theme">
          <!-- Sleek Sun Icon for Dark Mode -->
          <svg *ngIf="darkMode" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4 sm:h-5 sm:w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
          </svg>
          <!-- Sleek Moon Icon for Light Mode -->
          <svg *ngIf="!darkMode" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4 sm:h-5 sm:w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main content wrapper -->
  <div class="relative z-10 flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
    <router-outlet></router-outlet>
  </div>

  <!-- Minimalist footer -->
  <footer class="mt-auto border-t transition-colors duration-300" [ngClass]="darkMode ? 'border-slate-800/60 bg-black text-slate-500' : 'border-slate-200/60 bg-white text-slate-500'">
    <div class="w-full max-w-7xl mx-auto px-6 py-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between text-xs">
      <p>Crafted for students who want a refined and secure social experience.</p>
      <div class="flex flex-wrap gap-4 font-medium">
        <span>Privacy-first</span>
        <span>Campus-ready</span>
        <span>Built with modern tech</span>
      </div>
    </div>
  </footer>
</main>
